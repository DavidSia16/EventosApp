<!Doctype html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<!--Import materialize.css-->
<link type="text/css" rel="stylesheet" href="materialize/css/materialize.min.css"  media="screen,projection"/>

<head>
    <title>EventosApp</title>
</head>
<body>
    <h1>EventosApp</h1>
    <h3><a href="/eventos" class="waves-effect light btn" > <i class="material-icons left">format_list_bulleted</i>  Lista de Eventos</a></h3>
    <th:block th:include="mensagemValidacao"></th:block>
    <form  class="container" method="post">
        Nome : <input type="text" value="" name="nome">
        <div class="row">
            <div class=" input-field col s6">
                Local : <input type="text" value="" name="local">
            </div>
        </div>
        <div class="row">
            <div class="input-field col s3">
                Data : <input type="date" value="" name="data">
            </div>
        </div>

        </div>
        <div class="row">
            <div class="input-field col s3">
                Horário :  <input type="text" value="" name="horario">
            </div>
        </div>




        <button  class="waves-effect waves-light btn" type="submit">Salvar</button>
    </form>
    <script type="text/javascript" src="materialize/js/materialize.min.js"></script>
</body>

</html>
