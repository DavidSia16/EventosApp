<!Doctype html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<!--Import materialize.css-->
<link type="text/css" rel="stylesheet" href="materialize/css/materialize.min.css"  media="screen,projection"/>
<link type="text/css" rel="stylesheet" href="materialize/style/style.css"/>
<head>
    <title class=>EventosApp</title>
</head>
<body>
    <header>
        <nav>
            <div class="nav-wrapper">
                <a href="#" class="brand-logo">Lista de Eventos</a>
                <ul id="nav-mobile" class="right hide-on-med-and-down">
                    <li><a href="/eventos" class="waves-effect light btn" > <i class="material-icons left">format_list_bulleted</i>  Lista de Eventos</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <div class="container formEvento">
        <h1>EventosApp</h1>
        <th:block th:include="mensagemValidacao"></th:block>
    <form method="post">
        Nome : <input type="text" value="" name="nome">
        <div class="row">
            <div class=" input-field col s6">
                Local : <input type="text" value="" name="local">
            </div>
        </div>
        <div class="row">
            <div class="input-field col s3">
                Data : <input type="date" value="" name="data">
            </div>
        </div>

        <div class="row">
            <div class="input-field col s3">
                Horário :  <input type="time" value="" name="horario">
            </div>
        </div>

        <button  class="waves-effect waves-light btn" type="submit">Salvar</button>
    </form>
    </div>
    <script type="text/javascript" src="materialize/js/materialize.min.js"></script>
</body>

</html>
