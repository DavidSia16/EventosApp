<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventosApp - Cadastrar Evento</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <link type="text/css" rel="stylesheet" href="materialize/css/materialize.min.css" media="screen,projection"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="materialize/style/style.css"/>

</head>
<body>
<header>
    <nav class="nav-futuristic">
        <div class="nav-wrapper container">
            <a href="/cadastrarEvento" class="brand-logo futuristic-title">EventosApp</a>
            <ul id="nav-mobile" class="right">
                <li>
                    <a href="/eventos" class="waves-effect btn-small btn-futuristic">
                        <i class="material-icons left">format_list_bulleted</i> Lista de Eventos
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<div class="container app-container">
    <div class="row" style="width: 100%; max-width: 600px;">
        <div class="col s12">
            <div class="card futuristic-card">
                <div class="card-content">
                        <span class="card-title center-align futuristic-title" style="margin-bottom: 1.5rem;">
                            Cadastrar Evento
                        </span>

                    <th:block th:include="mensagemValidacao"></th:block>

                    <form method="post">
                        <div class="input-field col s12">
                            <i class="material-icons prefix">title</i>
                            <input type="text" id="nome" name="nome" required>
                            <label for="nome">Nome do Evento</label>
                        </div>

                        <div class="input-field col s12">
                            <i class="material-icons prefix">place</i>
                            <input type="text" id="local" name="local" required>
                            <label for="local">Local</label>
                        </div>

                        <div class="input-field col s12 m6">
                            <i class="material-icons prefix">event</i>
                            <input type="date" id="data" name="data" required>
                            <label for="data" class="active">Data</label>
                        </div>

                        <div class="input-field col s12 m6">
                            <i class="material-icons prefix">schedule</i>
                            <input type="time" id="horario" name="horario" required>
                            <label for="horario" class="active">Horário</label>
                        </div>

                        <button class="btn waves-effect waves-light btn-futuristic col s12" type="submit" style="margin-top: 1rem;">
                            Salvar Evento
                            <i class="material-icons right">send</i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="materialize/js/materialize.min.js"></script>
</body>
</html>
