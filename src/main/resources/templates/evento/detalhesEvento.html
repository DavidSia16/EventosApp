<!Doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<!--Import Google Icon Font-->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<!--Import materialize.css-->
<link type="text/css" rel="stylesheet" href="materialize/css/materialize.min.css"  media="screen,projection"/>
<head>
    <title>EventosApp</title>
</head>
<body>
<h1>Lista de Eventos</h1>
<h3><a class="waves-effect waves-light btn" href="/cadastrarEvento"><i class="material-icons">add_circle_outline</i>  Cadastrar Evento</a></h3>
<div th:each="evento : ${evento}" class="container">
    <div class="row">
        <p> Nome :<span th:text="${evento.nome}"></span></p>
        <p> Local :<span th:text="${evento.local}"></span></p>
        <p> Data : <span th:text="${evento.data}"></span></p>
        <p> Horario : <span th:text="${evento.horario}"></span></p>

        <form method="post">
            Nome : <input type="text" value="" name="nomeConvidado" />
            RG : <input type="text" value="" name="rg" />
            <button class="btn waves-effect waves-light" type="submit" name="action">Adicionar </button>
        </form>
    </div>
</div>

</div>
<script type="text/javascript" src="materialize/js/materialize.min.js"></script>
</body>

</html>
