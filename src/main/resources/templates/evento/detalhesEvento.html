<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Eventos</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Google Fonts (Roboto / Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="materialize/style/style.css"/>


</head>
<body>


<nav class="nav-futuristic">
    <div class="nav-wrapper container">
        <a href="/eventos" class="brand-logo left futuristic-title" style="font-size: 1.4rem;">
            <i class="material-icons left" style="color: #8b5cf6;">event</i>Eventos App
        </a>
        <ul id="nav-mobile" class="right">
            <li><a href="/logout" class="waves-effect waves-light btn-small btn-futuristic">Sair</a></li>
        </ul>
    </div>
</nav>

<!-- Conteúdo Centralizado: Detalhes do Evento -->
<div class="container app-container">
    <div class="row style-row" style="width: 100%; max-width: 600px;">
        <div class="col s12">
            <div class="card futuristic-card">
                <div class="card-content">
                    <span class="card-title center-align futuristic-title" style="margin-bottom: 2rem;">
                        Detalhes do Evento
                    </span>

                    <div class="row" th:object="${evento}">
                        <div class="input-field col s12">
                            <i class="material-icons prefix">title</i>
                            <input id="nome" type="text" th:value="*{nome}" readonly>
                            <label for="nome" class="active">Nome do Evento</label>
                        </div>

                        <div class="input-field col s12 m6">
                            <i class="material-icons prefix">place</i>
                            <input id="local" type="text" th:value="*{local}" readonly>
                            <label for="local" class="active">Local</label>
                        </div>

                        <div class="input-field col s12 m6">
                            <i class="material-icons prefix">event</i>
                            <input id="data" type="text" th:value="*{data}" readonly>
                            <label for="data" class="active">Data</label>
                        </div>

                        <div class="input-field col s12">
                            <i class="material-icons prefix">schedule</i>
                            <input id="horario" type="text" th:value="*{horario}" readonly>
                            <label for="horario" class="active">Horário</label>
                        </div>
                    </div>
                </div>

                <div class="card-content">
                    <span class="card-title futuristic-title" style="margin-bottom: 1.5rem;">
                        Lista de Convidados
                    </span>

                    <table class="highlight responsive-table">
                        <thead>
                        <tr>
                            <th>Nome Convidado</th>
                            <th>RG</th>
                            <th class="center-align">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="convidado : ${convidados}">
                            <td><span th:text="${convidado.nomeConvidado}"></span></td>
                            <td><span th:text="${convidado.rg}"></span></td>
                            <td class="center-align">
                                <a class="waves-effect waves-light btn-small btn-futuristic red-text text-lighten-2"
                                   th:href="${(#mvc.url('EC#deletarConvidado').arg(0, convidado.rg)).build()}"
                                   title="Deletar Convidado">
                                    <i class="material-icons">delete</i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div>
                        <span style="margin-bottom: 3rem;"></span>
                    </div>

                    <!-- Bloco de Validação de Mensagens -->
                    <th:block th:include="mensagemValidacao"></th:block>
                    <div class="card futuristic-card " style="margin-top: 5rem;">
                    <div class="card-content" >
                    <span class="card-title center-align futuristic-title" style="margin-bottom: 2rem;">
                        Adicionar Convidado
                    </span>

                        <form method="post" th:object="${convidado}">
                            <div class="row">
                                <div class="input-field col s12">
                                    <i class="material-icons prefix">person</i>
                                    <input id="nomeConvidado" type="text" th:field="*{nomeConvidado}" class="validate" required>
                                    <label for="nomeConvidado">Nome Completo</label>
                                </div>
                            </div>

                            <div class="row">
                                <div class="input-field col s12">
                                    <i class="material-icons prefix">badge</i>
                                    <input id="rg" type="text" th:field="*{rg}" class="validate" placeholder="AA-00.000.000" required>
                                    <label for="rg" class="active">RG</label>
                                </div>
                            </div>

                            <div class="row center-align" style="margin-top: 1.5rem; margin-bottom: 0;">
                                <button class="btn waves-effect waves-light btn-futuristic col s12" type="submit">
                                    Adicionar Convidado
                                    <i class="material-icons right">person_add</i>
                                </button>
                            </div>
                        </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
