<!Doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<!--Import Google Icon Font-->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<!--Import materialize.css-->
<link type="text/css" rel="stylesheet" href="materialize/style/style.css"/>
<link type="text/css" rel="stylesheet" href="materialize/css/materialize.min.css"  media="screen,projection"/>
<head>
    <title>EventosApp</title>
</head>
<body>
    <header>
        <nav>
            <div class="nav-wrapper">
                <a href="#" class="brand-logo">Lista de Eventos</a>
                <ul id="nav-mobile" class="right hide-on-med-and-down">
                    <li><a  href="/cadastrarEvento" class="waves-effect waves-light btn"><i class="material-icons left">add_circle_outline</i>  Cadastrar Evento</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <h1>Lista de Eventos</h1>
      <table class="container">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Local</th>
                <th>Data</th>
                <th>Horario</th>
                <th>Deletar</th>
            </tr>

        </thead>
        <tbody>
            <tr th:each="evento : ${eventos}">
                <td><a th:href="${(#mvc.url('EC#detalhesEvento').arg(0, evento.id)).build()}"><span th:text="${evento.nome}"></span><br></a></td>
                <td><p><span th:text="${evento.local}"></span><br></p></td>
                <td><p><span th:text="${evento.data}"></span><br></p></td>
                <td><p><span th:text="${evento.horario}"></span><br></p></td>
                <td><a class="waves-effect waves-light btn-small-center" th:href="${(#mvc.url('EC#deletarEvento').arg(0, evento.id)).build()}"><i class="material-icons left">delete</i></a></td>
            </tr>
        </tbody>
    </table>

    </div>
    <script type="text/javascript" src="materialize/js/materialize.min.js"></script>
</body>

</html>
