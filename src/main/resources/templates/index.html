<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventosApp - Lista</title>

    <link href="https://fonts.googleapis.com/icon?family=Material-Icons" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="materialize/css/materialize.min.css" media="screen,projection"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="materialize/style/style.css"/>

</head>
<body>
<header>
    <nav class="nav-futuristic">
        <div class="nav-wrapper container">
            <a href="/eventos" class="brand-logo futuristic-title">Lista de Eventos</a>
            <ul id="nav-mobile" class="right">
                <li>
                    <a href="/cadastrarEvento" class="waves-effect waves-light btn-small btn-futuristic">
                        Cadastrar Evento
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<div class="container">
    <div class="table-container">
        <h4 class="futuristic-title center-align" style="margin-bottom: 2rem;">Eventos Cadastrados</h4>
        <table class="responsive-table futuristic-table">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Local</th>
                <th>Data</th>
                <th>Horário</th>
                <th class="center-align">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="evento : ${eventos}">
                <td>
                    <a class="event-link" th:href="${(#mvc.url('EC#detalhesEvento').arg(0, evento.id)).build()}" th:text="${evento.nome}"></a>
                </td>
                <td th:text="${evento.local}"></td>
                <td th:text="${evento.data}"></td>
                <td th:text="${evento.horario}"></td>
                <td class="center-align">
                    <a class="btn-delete waves-effect" th:href="${(#mvc.url('EC#deletarEvento').arg(0, evento.id)).build()}">
                        <i class="material-icons" style="font-size: 1.2rem; vertical-align: middle;">delete</i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script type="text/javascript" src="materialize/js/materialize.min.js"></script>
</body>
</html>
